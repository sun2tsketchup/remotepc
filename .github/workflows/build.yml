name: Build RemotePC

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build RemotePC.exe
        run: bash agent-go/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RemotePC-windows
          path: RemotePC-v*.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Lấy số phiên bản
        id: ver
        run: |
          VER=$(grep -oP 'var Version = "\K[^"]+' agent-go/main.go)
          IFS=. read MA MI PA <<< "$VER"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_OUTPUT"
      - name: Khoá ký app (từ GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease -PappVersion=${{ steps.ver.outputs.ver }} -PappCode=${{ steps.ver.outputs.code }}
      - name: Đặt tên file theo phiên bản
        run: cp android/app/build/outputs/apk/release/app-release.apk RemotePC-v${{ steps.ver.outputs.ver }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RemotePC-android
          path: RemotePC-v*.apk

  # Mỗi lần đẩy lên main: tạo/cập nhật bản phát hành v<phiên bản> kèm file exe và apk để tải.
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Lấy số phiên bản
        id: ver
        run: echo "ver=$(grep -oP 'var Version = "\K[^"]+' agent-go/main.go)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          name: RemotePC v${{ steps.ver.outputs.ver }}
          body: "Tải RemotePC-v${{ steps.ver.outputs.ver }}.exe cho máy tính Windows và RemotePC-v${{ steps.ver.outputs.ver }}.apk cho điện thoại Android. Xem CHANGELOG.md."
          files: |
            RemotePC-v*.exe
            RemotePC-v*.apk
